name: Profile Cards

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/profile-cards.yml"

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate SVG cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_LOGIN: Logic769
        run: python3 scripts/gen_cards.py

      - name: Commit refreshed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain assets)" ]; then
            echo "cards unchanged"
            exit 0
          fi
          git add assets
          git commit -m "chore: refresh profile cards [skip ci]"
          git push
